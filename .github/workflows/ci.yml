name: CI - Marmitaria

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Fazer build
        run: npm run build

     