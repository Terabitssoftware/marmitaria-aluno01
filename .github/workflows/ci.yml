name: CI - Marmitaria

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Build NestJS
        run: npm run build

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

      - name: Verificar secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ]; then echo "VPS_HOST: OK"; else echo "VPS_HOST: VAZIO"; fi
          if [ -n "$VPS_USER" ]; then echo "VPS_USER: OK"; else echo "VPS_USER: VAZIO"; fi
          if [ -n "$VPS_SSH_KEY" ]; then echo "VPS_SSH_KEY: OK"; else echo "VPS_SSH_KEY: VAZIO"; fi
      
      - name: Deploy na VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            docker pull ghcr.io/terabitssoftware/marmitaria-aluno01:latest

            docker stop marmitaria-aluno01-v2 || true
            docker rm marmitaria-aluno01-v2 || true

            docker run -d \
              --name marmitaria-aluno01-v2 \
              -p 3102:3000 \
              ghcr.io/terabitssoftware/marmitaria-aluno01:latest
          EOF