
name: CI - Marmitaria

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: [self-hosted, terabits]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Fazer build
        run: npm run build

      # Aqui começa o CD

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar imagem Docker
        run: |
          docker build -t ghcr.io/terabitssoftware/marmitaria-aluno01:latest .

      - name: Enviar imagem para GHCR
        run: |
          docker push ghcr.io/terabitssoftware/marmitaria-aluno01:latest

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}

          script: |
            docker pull ghcr.io/terabitssoftware/marmitaria-aluno01:latest

            docker stop marmitaria || true

            docker rm marmitaria || true

            docker run -d \
              --name marmitaria \
              -p 3013:3000 \
              ghcr.io/terabitssoftware/marmitaria-aluno01:latest

